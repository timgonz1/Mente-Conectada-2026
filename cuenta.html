<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenteConectada - Cuenta</title>
  <link rel="stylesheet" href="../css/cuenta.css">
<body>

  <div class="app-contenedor">
    <aside class="barralateral">
      <div class="menu-item">
    
        <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" class="icono-casa">
        <p>Inicio</p>
      
        <br>
      </div>
      <div class="menu-item">
        <span class="icono">🧩</span>
        <span class="text">Explorar</span>
        <br>
      </div>
      <div class="menu-item">
        <span class="icono">📈</span>
        <span class="text">Progreso</span>
        <br>
      </div>
      <div class="menu-item activo">
        <span class="icono">👤</span>
        <span class="text">Perfil</span>
        <br>
      </div>
    </aside>

    <main class="main-contenido">
      
      <header class="header">
        <h1 class="logo">MenteConectada</h1>
        <div class="buscador">
          <input type="text" placeholder="Buscar" class="buscador-input">
        </div>
      </header>
      <div class="content-body">
        
        <section class="user-presentation">
          <h2 class="user-title-name">Elena<br>Ruiz</h2>
          <div class="profile-photo-wrapper">
        <img src="../imagenes/elena.jpg" alt="Foto de Elena" class="profile-img">
          </div>
        </section>
        <section class="account-details">
          <h2 class="page-title">Cuenta</h2>
          
          <div class="info-card">
            <div class="info-row">
              <span class="label">Nombre completo:</span>
              <span class="value">Elena Ruiz Zapata</span>
            </div>
            <div class="info-row">
              <span class="label">Correro Electronico:</span>
              <span class="value">EleRuizpata@gmail.com</span>
            </div>
            <div class="info-row">
              <span class="label">Numero de telefono:</span>
              <span class="value">3208765467</span>
            </div>
            <div class="info-row clickable">
              <span class="label">Actividad:</span>
              <span class="arrow">›</span>
            </div>
            <div class="info-row clickable">
              <span class="label">Cambiar contraseña:</span>
              <span class="arrow">›</span>
            </div>
          </div>

         

<a href="perfil.html" class="btn-back">
  ‹ Volver atrás
</a>



      </div>
    </main>

  </div>

</body>
</html>

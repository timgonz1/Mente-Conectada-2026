<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenteConectada - Progreso</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="../Css/progreso.css">
</head>
<body>


  <div class="encabezado">
    <div class="logo">MenteConectada</div>
    <div class="buscador-perfil">
      <input type="text" class="campo-busqueda" placeholder="Buscar">
      <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Perfil" class="avatar-header">
    </div>
  </div>


  <div class="contenedor-principal">

    <div class="seccion-titulo-progreso">
      <h1 class="titulo-progreso">TU PROGRESO EMOCIONAL</h1>
      <div class="opciones-animo-progreso">
        <span class="etiqueta-animo">✨ Radiante</span>
        <span class="etiqueta-animo opaco">💭 Angustiada</span>
        <span class="etiqueta-animo">🍃 Calmada</span>
        <span class="etiqueta-animo">🥱 Cansada</span>
      </div>
    </div>


    <div class="tarjeta-grafica">
      <div class="grafica-lineas">
        <div class="linea verde"></div>
        <div class="linea marron"></div>
        <div class="linea gris"></div>
        <div class="etiqueta-flotante">+2 Semanas Calmada</div>
      </div>
      <div class="eje-x">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
      </div>
      <div class="subtitulo-semanas">Semanas</div>
    </div>


    <div class="tarjeta-analisis">
      <div class="texto-analisis">
        <strong>Análisis semanal:</strong> Tu estado radiante ha aumentado un 15%
      </div>
      
      <div class="grafica-barras">
        <div class="barra-grupo">
          <div class="barra marron-oscuro" style="height: 70%;"></div>
        </div>
        <div class="barra-grupo">
          <div class="barra verde" style="height: 85%;"></div>
        </div>
        <div class="barra-grupo">
          <div class="barra marron-oscuro" style="height: 45%;"></div>
        </div>
        <div class="barra-grupo">
          <div class="barra gris-claro" style="height: 30%;"></div>
        </div>
      </div>

      <div class="leyenda-barras">
        <div class="leyenda-item">
          <div class="cuadadro-color marron-oscuro"></div>
          <span>Esta semana</span>
        </div>
        <div class="leyenda-item">
          <div class="cuadadro-color gris-claro"></div>
          <span>Semana pasada</span>
        </div>
      </div>
    </div>


    <div class="tarjeta-calendario">
      <div class="cabecera-dias">
        <span>L</span><span>M</span><span>M</span><span>J</span><span>S</span><span>V</span><span>D</span>
      </div>
      <div class="cuerpo-checks">
        <span></span><span></span>
        <span class="check-circulo">✓</span>
        <span class="check-circulo">✓</span>
        <span class="check-circulo">✓</span>
        <span></span><span></span>
      </div>
    </div>

  </div>


  <div class="menu-inferior">
    <div class="item-menu">
      <a href="inicio.html">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Inicio" class="icono-casa">
        <p>Inicio</p>
      </a>
    </div>
    <div class="item-menu">
      <a href="exploracion-medi.html">
        <span>🧩</span>
        <p>Explorar</p>
      </a>
    </div>
    <div class="item-menu activo">
      <a href="progreso.html">
        <span>📈</span>
        <p>Progreso</p>
      </a>
    </div>
    <div class="item-menu">
      <a href="perfil.html">
        <span>👤</span>
        <p>Perfil</p>
      </a>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenteConectada - Explorar Publicaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Css/exploracion-publi.css">
</head>
<body>

  <div class="encabezado">
    <div class="logo">MenteConectada</div>
    <div class="buscador-perfil">
      <input type="text" class="campo-busqueda" placeholder="Buscar">
      <a href="perfil.html">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Perfil" class="avatar-header">
      </a>
    </div>
  </div>

  <div class="contenedor-principal">
    <div class="seccion-titulo-explorar">
      <h1 class="titulo-explorar">EXPLORA RECURSOS</h1>
      <div class="opciones-categorias">
        <span class="etiqueta-categoria">VIDEOS</span>
        <span class="etiqueta-categoria">TEXTOS</span>
        <span class="etiqueta-categoria activa">PUBLICACIONES</span>
        <span class="etiqueta-categoria">SONIDOS</span>
        <span class="etiqueta-categoria">MEDITACION</span>
      </div>
    </div>

    <div class="lista-publicaciones">
      <div class="tarjeta-publicacion">
        <div class="encabezado-post">
          <div class="info-usuario">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&q=80" alt="Camila Perez" class="avatar-usuario">
            <div class="datos-post">
              <span class="nombre-usuario">Camila Perez</span>
              <span class="fecha-post">09/06 13h</span>
            </div>
          </div>
          <span class="visibilidad-post">publico</span>
        </div>

        <div class="caja-imagen-post">
          <img src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80" alt="Dia de meditacion">
          <h2 class="titulo-imagen-post">Dia de meditacion</h2>
        </div>

        <div class="acciones-post">
          <div class="grupo-acciones-izq">
            <button class="btn-icono">♡</button>
            <button class="btn-icono">💬</button>
          </div>
          <button class="btn-icono">↗</button>
        </div>
      </div>

      <div class="tarjeta-publicacion">
        <div class="encabezado-post">
          <div class="info-usuario">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Billie Eilish" class="avatar-usuario">
            <div class="datos-post">
              <span class="nombre-usuario">Billie Eilish</span>
              <span class="fecha-post">11/09 15h</span>
            </div>
          </div>
          <span class="visibilidad-post">publico</span>
        </div>

        <div class="cuerpo-post-musica">
          <div class="texto-musica">
            <h3>Hoy me siento:</h3>
            <h2>Happier than ever</h2>
          </div>
          <div class="reproductor-musica">
            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=300&q=80" alt="Portada Album" class="portada-album">
            <div class="controles-reproductor">
              <div class="barra-progreso"></div>
              <div class="botones-reproductor">
                <span>✕</span>
                <span>⏮</span>
                <span class="btn-play-negro">▶</span>
                <span>⏭</span>
                <span>↻</span>
              </div>
            </div>
          </div>
        </div>

        <div class="acciones-post">
          <div class="grupo-acciones-izq">
            <button class="btn-icono">♡</button>
            <button class="btn-icono">💬</button>
          </div>
          <button class="btn-icono">↗</button>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-inferior">
    <div class="item-menu">
      <a href="index.html">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Inicio" class="icono-casa">
        <p>Inicio</p>
      </a>
    </div>
    <div class="item-menu activo">
      <a href="explorar.html">
        <span>🧩</span>
        <p>Explorar</p>
      </a>
    </div>
    <div class="item-menu">
      <a href="progreso.html">
        <span>📈</span>
        <p>Progreso</p>
      </a>
    </div>
    <div class="item-menu">
      <a href="perfil.html">
        <span>👤</span>
        <p>Perfil</p>
      </a>
    </div>
  </div>

</body>
</html>
